worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # Rate limiting — 10 req/min sur le login, burst 3
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    upstream backend  { server backend:8000;  keepalive 32; }
    upstream frontend { server frontend:80;   keepalive 16; }

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header X-XSS-Protection           "1; mode=block"                   always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        # camera=(self) requis pour le scanner code-barre (BarcodeDetector API)
        # Attention : la caméra ne fonctionne qu'en HTTPS ou localhost
        add_header Permissions-Policy         "geolocation=(), camera=(self), microphone=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.openfoodfacts.org https://static.openfoodfacts.org; connect-src 'self';"
            always;

        # ── Login — limité en débit ───────────────────────────────────
        location = /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 10s;
        }

        # ── API ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
        }

        # ── Frontend SPA ──────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }
    }

    # ── HTTPS — décommenter pour activer SSL ──────────────────────────
    #
    # Prérequis :
    #   1. Placez cert.pem et key.pem dans ./nginx/ssl/
    #   2. Ajoutez dans le service nginx de docker-compose.yml :
    #        volumes:
    #          - ./nginx/ssl:/etc/nginx/ssl:ro
    #        ports:
    #          - "443:443"
    #   3. Réglez APP_PORT=443 (et gardez 80 pour la redirection)
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # (mêmes blocs location qu'au-dessus)
    # }
    #
    # # Redirection HTTP → HTTPS
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }
}
